[build]
  command = "sh netlify/build.sh"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[functions."ica-pdf"]
  external_node_modules = ["@sparticuz/chromium"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

# ---------- API endpoint rewrites ----------

[[redirects]]
  from = "/api/blog"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/api/chatbot-escalation"
  to = "/.netlify/functions/chatbot-escalation"
  status = 200

[[redirects]]
  from = "/api/create-payment-intent"
  to = "/.netlify/functions/create-payment-intent"
  status = 200

[[redirects]]
  from = "/api/finalize-join"
  to = "/.netlify/functions/finalize-join"
  status = 200

[[redirects]]
  from = "/api/ica-pdf"
  to = "/.netlify/functions/ica-pdf"
  status = 200

[[redirects]]
  from = "/api/parse-license"
  to = "/.netlify/functions/parse-license"
  status = 200

[[redirects]]
  from = "/api/send-broker-summary"
  to = "/.netlify/functions/send-broker-summary"
  status = 200

[[redirects]]
  from = "/api/send-ica-copy"
  to = "/.netlify/functions/send-ica-copy"
  status = 200

[[redirects]]
  from = "/api/send-payment-receipt"
  to = "/.netlify/functions/send-payment-receipt"
  status = 200

[[redirects]]
  from = "/api/setup-recurring"
  to = "/.netlify/functions/setup-recurring"
  status = 200

[[redirects]]
  from = "/api/update-payment-intent"
  to = "/.netlify/functions/update-payment-intent"
  status = 200

[[redirects]]
  from = "/api/validate-coupon"
  to = "/.netlify/functions/validate-coupon"
  status = 200

# ---------- Blog rewrites (match vercel.json) ----------

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/blog/"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog?slug=:slug"
  status = 200
