[build]
  command = "sh netlify/build.sh"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Serve the pages byte for byte. No link rewriting by Netlify.
[build.processing.html]
  pretty_urls = false

# The browser files are read from disk at run time, so they are named here.
[functions."ica-pdf"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]
