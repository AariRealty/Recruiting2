<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Independent Contractor Agreement: Aari Realty LLC (Print Version)</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px;
      line-height: 1.8;
      color: #0a0a0a;
      background: #ffffff;
      max-width: 8.5in;
      margin: 0 auto;
      padding: 0.75in 1in;
    }

    h1, h2, h3, h4 {
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      color: #0a0a0a;
    }

    h1 {
      font-size: 28px;
      font-weight: 300;
      text-align: center;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(10, 10, 10, 0.4);
      margin: 32px 0 16px;
      border-bottom: 1px solid rgba(10, 10, 10, 0.1);
      padding-bottom: 6px;
    }

    h3 {
      font-size: 15px;
      font-weight: 700;
      margin: 24px 0 8px;
    }

    h4 {
      font-size: 13px;
      font-weight: 600;
      margin: 18px 0 6px;
    }

    p {
      margin-bottom: 10px;
    }

    strong {
      font-weight: 700;
    }

    /* Cover page */
    .cover-page {
      text-align: center;
      padding: 3in 0 2in;
    }

    .cover-page h1 {
      font-size: 36px;
      font-weight: 300;
      margin-bottom: 8px;
    }

    .cover-divider {
      width: 40px;
      height: 1px;
      background: rgba(10, 10, 10, 0.2);
      margin: 24px auto;
    }

    .cover-detail {
      font-size: 13px;
      color: rgba(10, 10, 10, 0.5);
      line-height: 2.2;
    }

    .cover-detail strong {
      color: #0a0a0a;
    }

    .cover-brokerage {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(10, 10, 10, 0.3);
    }

    /* Document list */
    .doc-list {
      list-style: none;
      padding: 0;
      margin: 12px 0;
    }

    .doc-list li {
      padding: 5px 0;
      font-size: 13px;
      color: rgba(10, 10, 10, 0.7);
      border-bottom: 1px solid rgba(10, 10, 10, 0.06);
    }

    .doc-list li::before {
      content: "\00B7\00A0\00A0";
      font-weight: bold;
    }

    /* Bullet lists */
    ul.bullet-list {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }

    ul.bullet-list li {
      padding: 4px 0;
      font-size: 13px;
      color: rgba(10, 10, 10, 0.75);
      border-bottom: 1px solid rgba(10, 10, 10, 0.06);
    }

    ul.bullet-list li::before {
      content: "\00B7\00A0\00A0";
      font-weight: bold;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 12px;
    }

    table th {
      background: #0a0a0a;
      color: #ffffff;
      padding: 8px 10px;
      text-align: left;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(10, 10, 10, 0.1);
      color: #0a0a0a;
    }

    table tr:nth-child(even) td {
      background: rgba(10, 10, 10, 0.02);
    }

    /* Signature block */
    .signature-block {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 2px solid #0a0a0a;
    }

    .sig-row {
      display: flex;
      gap: 48px;
      margin-top: 36px;
    }

    .sig-col {
      flex: 1;
    }

    .sig-line {
      border-bottom: 1px solid #0a0a0a;
      height: 36px;
      margin-bottom: 4px;
    }

    .sig-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(10, 10, 10, 0.5);
    }

    /* Footer */
    .page-footer {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(10, 10, 10, 0.3);
      text-align: center;
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid rgba(10, 10, 10, 0.1);
    }

    /* Print styles */
    @media print {
      body {
        padding: 0;
        font-size: 11pt;
        max-width: none;
      }

      @page {
        size: letter;
        margin: 0.75in 1in;

        @bottom-center {
          content: "Aari Realty LLC · ICA v5 · Effective July 26, 2026";
          font-family: 'Montserrat', sans-serif;
          font-size: 8pt;
          color: #999;
          letter-spacing: 0.5px;
        }
      }

      .cover-page {
        padding: 3in 0 2in;
      }

      .page-break {
        page-break-before: always;
      }

      .no-break {
        page-break-inside: avoid;
      }

      .page-footer {
        display: none;
      }
    }

    /* Screen footer repetition */
    @media screen {
      .page-break {
        border-top: 1px dashed rgba(10, 10, 10, 0.15);
        padding-top: 32px;
        margin-top: 32px;
      }
    }
  </style>
</head>
<body>

<!-- ============================== COVER PAGE ============================== -->
<div class="cover-page">
  <h1>Independent Contractor<br>Agreement</h1>
  <div class="cover-divider"></div>
  <p class="cover-detail"><strong>Aari Realty LLC</strong></p>
  <p class="cover-detail">Licensed Real Estate Brokerage</p>
  <p class="cover-detail">Fort Myers, Florida</p>
  <div class="cover-divider"></div>
  <p class="cover-brokerage">Aari Realty LLC</p>
</div>

<div class="page-footer">Aari Realty LLC &middot; ICA v5 &middot; Effective July 26, 2026<br>9160 Forum Corporate Pkwy, Suite 350 &middot; Fort Myers, FL 33905 &middot; 239.688.1770</div>

<!-- Content loaded from ica-content.js -->
<div id="ica-print-content"></div>

<script src="ica-content.js"></script>
<script>
(function(){
  if(!window.ICA_CONTENT) return;
  var c = ICA_CONTENT;
  var footer = '<div class="page-footer">Aari Realty LLC &middot; ICA v5 &middot; Effective July 26, 2026<br>9160 Forum Corporate Pkwy, Suite 350 &middot; Fort Myers, FL 33905 &middot; 239.688.1770</div>';
  var pb = '<div class="page-break"></div>';

  // Combine all content in document order
  var all = c.agreement + c.commission + c.operations + c.acknowledgments;
  // Actually we need to concatenate properly with the right sections
  var sections = [c.agreement, c.commission, c.operations, c.acknowledgments];
  var fullHtml = '';

  sections.forEach(function(section) {
    // Insert page breaks before each <h2> and add page footers
    var parts = section.split(/(?=<h2>)/g);
    parts.forEach(function(part, i) {
      if (part.trim()) {
        if (fullHtml) fullHtml += footer + '\n' + pb + '\n';
        fullHtml += part;
      }
    });
  });

  // Add final footer
  fullHtml += footer;

  document.getElementById('ica-print-content').innerHTML = fullHtml;
})();
</script>



</body>
</html>
